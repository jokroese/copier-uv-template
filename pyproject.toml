[build-system]
requires = ["uv_build>=0.9.20,<0.10.0"]
build-backend = "uv_build"

[project]
name = "smoke-library"
version = "0.1.0"
description = "Integration test library"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = ["pre-commit", "pytest", "pyright[nodejs]", "ruff"]
dogfood = ["copier", "pytest-copie"]

[tool.pytest.ini_options]
markers = [
  "dogfood: generates projects from the template and runs the full toolchain",
]
