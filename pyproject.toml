[project]
name = "copier-uv-template"
version = "0.1.0"
description = "Copier template for uv Python projects"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = ["pre-commit", "pytest", "pyright[nodejs]", "ruff"]
dogfood = ["copier>=9.17.0", "pytest-copie"]

[tool.uv]
package = false

[tool.pytest.ini_options]
markers = [
  "dogfood: generates projects from the template and runs the full toolchain",
]
