_min_copier_version: "9.0.0"

project_name:
  type: str
  help: Project name (human-friendly)
  default: ""

project_slug:
  type: str
  help: Project slug (repo / distribution name)
  default: "{{ project_name|lower|replace(' ', '-')|replace('_','-') }}"

package_name:
  type: str
  help: Importable package name (Python identifier)
  default: "{{ project_slug|replace('-', '_') }}"

description:
  type: str
  help: One-line description
  default: ""

python_version:
  type: str
  help: Python version (used by tooling + CI)
  default: "3.12"

uv_version:
  type: str
  help: uv version for required-version and pre-commit rev (e.g. 0.9.20)
  default: "0.9.20"

project_kind:
  type: str
  help: App-first by default; switch to library when you intend to build/publish.
  choices:
    - app
    - library
  default: app

use_precommit:
  type: bool
  default: true

_answers_file: .copier-answers.yml
_skip_if_exists:
  - uv.lock
_templates_suffix: ".jinja"
_subdirectory: "template"

_exclude:
  - ".venv"
  - ".venv/**"
  - "**/.venv"
  - "**/.venv/**"
  - ".pytest_cache"
  - ".pytest_cache/**"
  - ".ruff_cache"
  - ".ruff_cache/**"
  - "__pycache__"
  - "**/__pycache__/**"
