_min_copier_version: "9.0.0"

project_name:
  type: str
  help: Project name (human-friendly)
  default: "My Project"

project_slug:
  type: str
  help: Project slug (repo / distribution name)
  default: "{{ project_name|lower|replace(' ', '-')|replace('_','-') }}"

package_name:
  type: str
  help: Importable package name (Python identifier)
  default: "{{ project_slug|replace('-', '_') }}"

description:
  type: str
  help: One-line description
  default: ""

python_version:
  type: str
  help: Python version (used by tooling + CI)
  default: "3.12"

project_kind:
  type: str
  help: App-first by default; switch to library when you intend to build/publish.
  choices:
    - app
    - library
  default: app

use_precommit:
  type: bool
  default: true

uv_precommit_rev:
  type: str
  help: Version of uv used by the uv-pre-commit hook.
  default: "0.9.20"

uv_version:
  type: str
  help: uv version range floor (kept in uv.toml required-version)
  default: "0.9.20"

uv_version_next_minor:
  type: str
  help: uv version range ceiling (exclusive)
  default: "0.10.0"

uv_build_floor:
  type: str
  help: uv_build floor (usually matches uv version)
  default: "{{ uv_version }}"

uv_build_ceiling:
  type: str
  help: uv_build ceiling (exclusive)
  default: "{{ uv_version_next_minor }}"

_answers_file: .copier-answers.yml
_skip_if_exists:
  - uv.lock
_templates_suffix: ".jinja"
_subdirectory: "template"

_exclude:
  - ".venv"
  - ".venv/**"
  - "**/.venv"
  - "**/.venv/**"
  - ".pytest_cache"
  - ".pytest_cache/**"
  - ".ruff_cache"
  - ".ruff_cache/**"
  - "__pycache__"
  - "**/__pycache__/**"
