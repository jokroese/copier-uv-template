repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml

  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check (uv)
        types: [python]
        entry: uv run ruff check --fix --exit-non-zero-on-fix
        language: system

      - id: ruff-format
        name: ruff format (uv)
        types: [python]
        entry: uv run ruff format
        language: system

      - id: pyright
        name: pyright (uv)
        entry: uv run pyright
        language: system
        pass_filenames: false

